name = "tessera-project-site"
version = "0.1.0"

[style]
source = "css"

[theme.tokens]
# Fallback palette (Cybercore dark). styles/main.css maps these --ts-* roles
# onto the shared theme chooser's variables, so any chosen theme overrides them.
primary = "#7c3aed"
secondary = "#2ee6f6"
color_bg = "#05070b"
color_text = "#d7e0e9"
color_heading = "#f2f6fa"
color_muted = "#7d8a99"
color_card = "#0b1017"
border_color = "#1a2431"
color_code_bg = "#0f1620"
color_code_block = "#070a10"
color_focus = "#2ee6f6"
font_main = "'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace"
font_display = "'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace"
container_max = "72rem"
grid_gap = "1rem"
