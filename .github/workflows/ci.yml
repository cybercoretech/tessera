name: CI

on:
  push:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
  pull_request:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Cargo check
        run: cargo check --all
